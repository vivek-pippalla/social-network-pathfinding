name: CI

# Pin external actions to full commit SHAs; update the version comment with the SHA.
# Dependabot updates are reviewed and linted before changing these pins.

on:
  push:
    branches: [main, "phase-*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install development tools
        run: python -m pip install -r requirements-dev.txt
      - name: Ruff lint and format
        run: |
          ruff check app tests scripts benchmarks optional_integrations
          ruff format --check app tests scripts benchmarks optional_integrations
      - name: Check documentation links
        run: python scripts/check_doc_links.py
      - name: Install Go for actionlint
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: "1.25.1"
      - name: Validate GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: ShellCheck active scripts
        run: shellcheck scripts/*.sh deploy/local/*.sh

  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APP_ENV: test
      SECRET_KEY: test-only-secret-key-32-bytes-minimum
      NEO4J_PASSWORD: unit-test-password
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install development tools
        run: python -m pip install -r requirements-dev.txt
      - name: Prepare test report directory
        run: mkdir -p test-results
      - name: Run unit and regression suite with coverage
        run: >-
          pytest -q -m "not integration and not e2e"
          --junitxml=test-results/unit.xml
          --cov=app.services --cov=app.repositories
          --cov-report=term-missing
          --cov-report=json:coverage.json
      - name: Enforce recorded service and repository coverage baselines
        run: python scripts/check_coverage_baseline.py coverage.json .github/coverage-baseline.json
      - name: Upload unit test report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-report
          path: test-results/unit.xml
          if-no-files-found: ignore
          retention-days: 7

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      APP_ENV: test
      SECRET_KEY: test-only-secret-key-32-bytes-minimum
      NEO4J_PASSWORD: integration-test-password
      TEST_NEO4J_URI: bolt://127.0.0.1:17687
      TEST_NEO4J_USER: neo4j
      TEST_NEO4J_PASSWORD: integration-test-password
      TEST_REDIS_URL: redis://127.0.0.1:16379/15
      REQUIRE_INTEGRATION: "1"
    services:
      neo4j:
        image: neo4j:5.12.0
        env:
          NEO4J_AUTH: neo4j/integration-test-password
        ports:
          - 17687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p integration-test-password 'RETURN 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 30s
      redis:
        image: redis:7-alpine
        ports:
          - 16379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install development tools
        run: python -m pip install -r requirements-dev.txt
      - name: Prepare test report directory
        run: mkdir -p test-results
      - name: Run required real-service integration suite
        run: pytest -q -m integration --junitxml=test-results/integration.xml
      - name: Upload integration test report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-test-report
          path: test-results/integration.xml
          if-no-files-found: ignore
          retention-days: 7

  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      APP_ENV: test
      SECRET_KEY: test-only-secret-key-32-bytes-minimum
      NEO4J_PASSWORD: contract-test-password
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install development tools
        run: python -m pip install -r requirements-dev.txt
      - name: Prepare test report directory
        run: mkdir -p test-results
      - name: Check generated API artifacts
        run: python scripts/export_openapi.py --check
      - name: Run API and frontend contract tests
        run: pytest -q tests/contract --junitxml=test-results/contract.xml
      - name: Upload contract test report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: contract-test-report
          path: test-results/contract.xml
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      APP_ENV: test
      SECRET_KEY: test-only-secret-key-32-bytes-minimum
      NEO4J_PASSWORD: phase12-ci-neo4j-password
      REDIS_PASSWORD: phase12-ci-redis-password
      GRAFANA_ADMIN_USER: phase12-ci-admin
      GRAFANA_ADMIN_PASSWORD: phase12-ci-grafana-password
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install development tools and browser
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Create disposable CI environment file
        run: |
          cat > .env <<'EOF'
          APP_ENV=test
          SECRET_KEY=test-only-secret-key-32-bytes-minimum
          NEO4J_URI=bolt://neo4j:7687
          NEO4J_USER=neo4j
          NEO4J_PASSWORD=phase12-ci-neo4j-password
          REDIS_URL=redis://localhost:6379/0
          REDIS_PASSWORD=phase12-ci-redis-password
          ENABLE_DOCS=false
          AUTO_SCHEMA=true
          API_IMAGE=social-network-api:ci
          GRAFANA_ADMIN_USER=phase12-ci-admin
          GRAFANA_ADMIN_PASSWORD=phase12-ci-grafana-password
          EOF
          mkdir -p test-results
      - name: Build and start the full Compose stack
        run: docker compose up -d --build --wait --wait-timeout 240
      - name: Verify API readiness
        run: curl --fail --retry 30 --retry-interval 2 --retry-all-errors http://127.0.0.1:5000/health/ready
      - name: Run browser smoke journey
        env:
          BASE_URL: http://127.0.0.1:5000
        run: pytest -q -m e2e tests/e2e --junitxml=test-results/e2e.xml
      - name: Upload E2E report and Playwright trace on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-failure-artifacts
          path: |
            test-results/e2e.xml
            test-results/playwright-trace.zip
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop Compose stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install audit and secret-scanning tools
        run: python -m pip install -r requirements-dev.txt
      - name: Audit runtime dependencies
        run: pip-audit -r requirements.txt
      - name: Scan tracked files for new secrets
        run: git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Build runtime image without publishing
        run: docker build --pull --tag social-network-api:ci .
