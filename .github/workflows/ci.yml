name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write   # Required for AWS OIDC temporary credentials
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1: Run Automated Tests & Static Checks
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: Test Suite (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite with pytest
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: test-password
          REDIS_URL: redis://localhost:6379/0
          CACHE_TTL_SECONDS: 3600
          SECRET_KEY: ci-test-secret-key-32-chars-long-here
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 30
          AWS_REGION: ap-south-1
          CLOUDWATCH_ENABLED: false
        run: pytest tests/ -v --tb=short

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: Build and Push Docker Image to Amazon ECR (Keyless OIDC)
  # ─────────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push ECR Image
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Authenticate with AWS via GitHub OIDC federation (No long-lived access keys)
      - name: Configure AWS Credentials via OIDC
        if: "${{ secrets.AWS_ROLE_TO_ASSUME != '' }}"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}
          audience: sts.amazonaws.com

      - name: Log in to Amazon ECR
        if: "${{ secrets.AWS_ROLE_TO_ASSUME != '' }}"
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to ECR
        if: "${{ secrets.AWS_ROLE_TO_ASSUME != '' }}"
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: social-network-api
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 3: Continuous Deployment to EC2 via Unified Deployment Script
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to AWS EC2
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && secrets.EC2_HOST != ''
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository for compose files
        uses: actions/checkout@v4

      - name: Configure SSH key & host-key verification
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          # Strictly require pinned EC2_SSH_KNOWN_HOSTS to prevent MITM attacks
          if [ -z "${{ secrets.EC2_SSH_KNOWN_HOSTS }}" ]; then
            echo "::error::Deployment halted: EC2_SSH_KNOWN_HOSTS secret is missing or empty."
            echo "To prevent Man-in-the-Middle (MITM) attacks, host-key verification is mandatory."
            echo "Obtain the host key from EC2 console output, verify fingerprint, and set EC2_SSH_KNOWN_HOSTS."
            exit 1
          fi

          echo "${{ secrets.EC2_SSH_KNOWN_HOSTS }}" | tr -d '\r' >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Sync production compose, Caddyfile & deployment script to EC2
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.EC2_USER || 'ubuntu' }}@${{ secrets.EC2_HOST }} 'mkdir -p /opt/social-network-pathfinding/caddy /opt/social-network-pathfinding/scripts'
          scp -i ~/.ssh/id_rsa docker-compose.prod.yml ${{ secrets.EC2_USER || 'ubuntu' }}@${{ secrets.EC2_HOST }}:/opt/social-network-pathfinding/docker-compose.prod.yml
          scp -i ~/.ssh/id_rsa caddy/Caddyfile ${{ secrets.EC2_USER || 'ubuntu' }}@${{ secrets.EC2_HOST }}:/opt/social-network-pathfinding/caddy/Caddyfile
          scp -i ~/.ssh/id_rsa scripts/deploy_prod.sh ${{ secrets.EC2_USER || 'ubuntu' }}@${{ secrets.EC2_HOST }}:/opt/social-network-pathfinding/scripts/deploy_prod.sh

      - name: Execute unified deployment script on EC2
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.EC2_USER || 'ubuntu' }}@${{ secrets.EC2_HOST }} 'bash -s' << 'EOF'
            set -euo pipefail
            chmod +x /opt/social-network-pathfinding/scripts/deploy_prod.sh
            /opt/social-network-pathfinding/scripts/deploy_prod.sh
          EOF
