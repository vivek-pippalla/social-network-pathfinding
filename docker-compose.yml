services:
  api:
    image: ${API_IMAGE:-social-network-api:local}
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      NEO4J_URI: bolt://neo4j:7687
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379/0
      FORWARDED_ALLOW_IPS: ${TRUSTED_PROXY_ADDRESSES:-127.0.0.1,::1}
    expose:
      - "5000"
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - social-network

  neo4j:
    image: neo4j:5.12.0
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
      NEO4J_server_config_strict__validation_enabled: "false"
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP_INITIAL:-512M}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_MAX:-1G}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-512M}
    volumes:
      - neo4j_data:/data
      - neo4j_backups:/backups
    expose:
      - "7474"
      - "7687"
    healthcheck:
      test:
        - CMD-SHELL
        - cypher-shell -u neo4j -p "$$NEO4J_PASSWORD" 'RETURN 1' >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    networks:
      - social-network

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - volatile-lru
      - --appendonly
      - "no"
      - --save
      - ""
    expose:
      - "6379"
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks:
      - social-network

  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v2.47.0
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - social-network

  grafana:
    profiles: [monitoring]
    image: grafana/grafana:10.1.0
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        test -n "$$GF_SECURITY_ADMIN_USER" &&
        test -n "$$GF_SECURITY_ADMIN_PASSWORD" &&
        test "$$GF_SECURITY_ADMIN_USER" != "replace-with-a-grafana-admin-user" &&
        test "$$GF_SECURITY_ADMIN_PASSWORD" != "replace-with-a-unique-grafana-password" &&
        exec /run.sh
    volumes:
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started
    restart: unless-stopped
    networks:
      - social-network

volumes:
  neo4j_data:
  neo4j_backups:
  prometheus_data:
  grafana_data:

networks:
  social-network:
    driver: bridge
