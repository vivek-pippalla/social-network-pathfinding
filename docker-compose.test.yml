# Isolated, disposable services used only by the integration test suite.
services:
  neo4j-test:
    image: neo4j:5.12.0
    ports:
      - "127.0.0.1:17687:7687"
    environment:
      NEO4J_AUTH: neo4j/integration-test-password
    tmpfs:
      - /data
      - /logs
      - /plugins
    healthcheck:
      test:
        - CMD-SHELL
        - cypher-shell -u neo4j -p integration-test-password 'RETURN 1' >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  redis-test:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:16379:6379"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
