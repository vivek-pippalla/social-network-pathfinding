services:
  api:
    environment:
      APP_ENV: prod
      ENABLE_DOCS: "false"
      FORWARDED_ALLOW_IPS: ${TRUSTED_PROXY_ADDRESSES:-172.29.0.0/24}
    networks:
      - social-network
      - edge

  caddy:
    image: caddy:2.8.4-alpine
    profiles: [edge]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - edge

volumes:
  caddy_data:
  caddy_config:

networks:
  edge:
    driver: bridge
    ipam:
      config:
        - subnet: ${EDGE_NETWORK_SUBNET:-172.29.0.0/24}
