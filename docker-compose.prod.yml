# ==============================================================================
# Production Docker Compose Configuration for AWS EC2
#
# Key Hardening & Production Measures:
# 1. Caddy reverse proxy serves HTTPS (443) and redirects HTTP (80) with auto TLS.
# 2. FastAPI (port 5000), Neo4j (7474/7687), and Redis (6379) are NOT published to host ports.
#    They exist exclusively on the internal virtual bridge network.
# 3. API uses pre-built, versioned Docker image from AWS ECR.
# 4. Memory limits configured to prevent any single service from exhausting EC2 RAM.
# 5. Strict health checks with auto-restart policies.
# 6. Production secrets (.env.prod) injected securely via host environment.
# ==============================================================================

services:
  # ─── Caddy Reverse Proxy (Public HTTPS/HTTP Gateway) ──────────────────────
  caddy:
    image: caddy:2.8.4-alpine
    container_name: social-network-caddy-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME:-localhost}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - internal-network

  # ─── FastAPI Application (Internal Only) ──────────────────────────────────
  api:
    image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION:-ap-south-1}.amazonaws.com/social-network-api:${IMAGE_TAG:-latest}
    container_name: social-network-api-prod
    restart: always
    # NOTICE: Port 5000 is NOT bound to the host.
    # Ingress is reverse-proxied exclusively through Caddy.
    expose:
      - "5000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - REDIS_URL=redis://redis:6379/0
      - CACHE_TTL_SECONDS=${CACHE_TTL_SECONDS:-3600}
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      - AWS_REGION=${AWS_REGION:-ap-south-1}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET:-}
      - AWS_S3_DATASET_KEY=${AWS_S3_DATASET_KEY:-datasets/facebook_combined.txt.gz}
      - CLOUDWATCH_ENABLED=${CLOUDWATCH_ENABLED:-true}
      - CLOUDWATCH_LOG_GROUP=${CLOUDWATCH_LOG_GROUP:-/social-network-pathfinding/app}
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - internal-network

  # ─── Neo4j Graph Database (Internal Only) ─────────────────────────────────
  neo4j:
    image: neo4j:5.12.0
    container_name: social-network-neo4j-prod
    restart: always
    # NOTICE: Ports 7474/7687 are NOT bound to host in production.
    # Access is restricted exclusively to containers inside internal-network.
    expose:
      - "7474"
      - "7687"
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
      - NEO4J_server_memory_pagecache_size=512M
      - NEO4J_server_memory_heap_initial__size=512M
      - NEO4J_server_memory_heap_max__size=1G
    volumes:
      - neo4j_prod_data:/data
    deploy:
      resources:
        limits:
          memory: 2048M
    healthcheck:
      test: ["CMD", "wget", "http://localhost:7474", "-O", "-"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - internal-network

  # ─── Redis Cache (Internal Only) ──────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: social-network-redis-prod
    restart: always
    # NOTICE: Port 6379 is NOT bound to host in production.
    expose:
      - "6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redis_prod_data:/data
    deploy:
      resources:
        limits:
          memory: 384M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal-network

volumes:
  caddy_data:
  caddy_config:
  neo4j_prod_data:
  redis_prod_data:

networks:
  internal-network:
    driver: bridge
